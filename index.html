<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahe Roggero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #FFFFFF;
      --ink:    #141412;
      --gray:   #8A8A87;
      --border: #E2E1DC;
      --f:      'DM Sans', system-ui, sans-serif;
      --pad:    22px;
      --gap:    14px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* ── PAGE LAYOUT ─────────────────────────────────── */
    .page {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding-bottom: var(--gap);
    }

    /* ── NEGATIVE SPACE ──────────────────────────────── */
    .negative-space {
      flex: 1;
      min-height: 0;
    }

    /* ── HEADER ──────────────────────────────────────── */
    .site-header {
      display: grid;
      grid-template-columns: clamp(180px, 29vw, 420px) 1fr;
      align-items: center;
      padding: var(--gap) clamp(24px, 4vw, 56px);
      flex-shrink: 0;
      background: transparent;
      will-change: transform;
    }

    .logo {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--ink);
      transition: opacity 0.2s;
    }

    .logo:hover { opacity: 0.5; }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 400;
      color: var(--gray);
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--ink); }

    /* ── CAROUSEL WRAPPER ────────────────────────────── */
    .carousel-wrapper {
      position: relative;
      width: 100vw;
      height: 65vh;
      overflow: hidden;
      cursor: grab;
      flex-shrink: 0;
    }

    .carousel-wrapper.dragging {
      cursor: grabbing;
    }

    /* ── TRACK ───────────────────────────────────────── */
    .carousel-track {
      display: flex;
      align-items: stretch;
      height: 100%;
      gap: var(--gap);
      will-change: transform;
    }

    .carousel-track img {
      height: 100%;
      width: auto;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    .carousel-track picture { display: contents; }

    /* ── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 768px) {
      .site-header {
        grid-template-columns: 1fr auto;
      }

      .carousel-track img {
        width: 65vw;
        height: 100%;
      }
    }

  </style>
</head>
<body>

  <script>
    const track   = document.getElementById('track');
    const wrapper = document.getElementById('wrapper');

    const SPEED    = 0.38;   // px per frame
    const GAP      = 14;     // matches CSS --gap
    const SET_SIZE = 9;

    let pos         = 0;
    let setWidth    = 0;
    let initialized = false;

    // Drag state
    let isDragging        = false;
    let dragStartX        = 0;
    let dragStartY        = 0;
    let dragStartPos      = 0;
    let totalDragDistance = 0;
    let lastDragX         = 0;
    let lastDragTime      = 0;
    const velSamples      = [];  // rolling velocity average

    /* ── Measure width of one image set ────────────── */
    function measureSet() {
      const imgs = track.querySelectorAll('img');
      let w = 0;
      for (let i = 0; i < SET_SIZE; i++) {
        w += imgs[i].offsetWidth + GAP;
      }
      setWidth = w;
    }

    /* ── Wrap position for infinite loop ────────────── */
    function wrap() {
      if (setWidth <= 0) return;
      pos = ((pos % setWidth) + setWidth) % setWidth;
    }

    /* ── Animation loop ─────────────────────────────── */
    function tick() {
      if (!isDragging) {
        pos += SPEED;
        wrap();
        track.style.transform = `translateX(-${pos}px)`;
      }
      requestAnimationFrame(tick);
    }

    /* ── Click & Drag ────────────────────────────────── */
    wrapper.addEventListener('mousedown', (e) => {
      isDragging        = true;
      dragStartX        = e.clientX;
      dragStartY        = e.clientY;
      dragStartPos      = pos;
      totalDragDistance = 0;
      lastDragX         = e.clientX;
      lastDragTime      = Date.now();
      velSamples.length = 0;
      wrapper.classList.add('dragging');
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const delta = dragStartX - e.clientX;
      pos = dragStartPos + delta;
      wrap();
      track.style.transform = `translateX(-${pos}px)`;

      // Accumulate total distance (for click detection)
      totalDragDistance += Math.abs(e.clientX - lastDragX);

      // Rolling velocity sample (px/ms)
      const now = Date.now();
      const dt  = now - lastDragTime;
      if (dt > 0) {
        const v = (lastDragX - e.clientX) / dt;
        velSamples.push(v);
        if (velSamples.length > 4) velSamples.shift();
      }
      lastDragX    = e.clientX;
      lastDragTime = now;
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      wrapper.classList.remove('dragging');

      // Click detection: negligible movement = navigate
      if (totalDragDistance < 6) {
        const el  = document.elementFromPoint(dragStartX, dragStartY);
        const img = el?.tagName === 'IMG' ? el : null;
        const href = img?.dataset?.href;
        if (href) {
          window.location.href = href;
          return;
        }
      }

      // Momentum — rolling average velocity for smooth feel
      const avgVel = velSamples.length
        ? velSamples.reduce((a, b) => a + b, 0) / velSamples.length
        : 0;
      let velocity = avgVel * 22;

      const applyMomentum = () => {
        if (Math.abs(velocity) > 0.05) {
          pos += velocity;
          wrap();
          track.style.transform = `translateX(-${pos}px)`;
          velocity *= 0.95;
          requestAnimationFrame(applyMomentum);
        }
      };
      applyMomentum();
    });

    /* ── Touch support ───────────────────────────────── */
    let touchX = 0;
    wrapper.addEventListener('touchstart', (e) => {
      touchX = e.touches[0].clientX;
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
      const dx = touchX - e.touches[0].clientX;
      touchX = e.touches[0].clientX;
      pos += dx;
      wrap();
      track.style.transform = `translateX(-${pos}px)`;
    }, { passive: true });

    /* ── Boot ────────────────────────────────────────── */
    window.addEventListener('load', () => {
      measureSet();
      initialized = true;
      requestAnimationFrame(tick);
    });

    setTimeout(() => {
      if (!initialized) {
        measureSet();
        initialized = true;
        requestAnimationFrame(tick);
      }
    }, 1500);
  </script>

  <script>
    // ── PAGE TRANSITION — HOME ──────────────────────────────
    (function() {
      var header  = document.querySelector('.site-header');
      var content = document.querySelector('.carousel-wrapper');

      function exitTo(url) {
        var dist = header.getBoundingClientRect().top;
        sessionStorage.setItem('vt-from', 'home');
        sessionStorage.setItem('vt-header-top', dist);
        sessionStorage.setItem('vt-nav-animated', '1');
        header.style.transition  = 'transform 0.5s cubic-bezier(0.25, 0, 0.1, 1)';
        header.style.transform   = 'translateY(-' + dist + 'px)';
        content.style.transition = 'opacity 0.5s ease';
        content.style.opacity    = '0';
        setTimeout(function() { window.location.href = url; }, 520);
      }

      // ENTRANCE : venant de projects ou about
      var from = sessionStorage.getItem('vt-from');
      if (from === 'projects' || from === 'about') {
        sessionStorage.removeItem('vt-from');
        var navAnimatedReturn = sessionStorage.getItem('vt-nav-animated-return');
        sessionStorage.removeItem('vt-nav-animated-return');

        if (navAnimatedReturn) {
          // Nav déjà descendu côté exit → juste fade in contenu
          content.style.opacity = '0';
          requestAnimationFrame(function() { requestAnimationFrame(function() {
            content.style.transition = 'opacity 0.7s ease';
            content.style.opacity    = '1';
          }); });
        } else {
          // Fallback : animation originale ralentie
          var dist = header.getBoundingClientRect().top;
          header.style.transition  = 'none';
          header.style.transform   = 'translateY(-' + dist + 'px)';
          content.style.opacity    = '0';
          requestAnimationFrame(function() { requestAnimationFrame(function() {
            header.style.transition  = 'transform 0.65s cubic-bezier(0.25, 0, 0.1, 1)';
            header.style.transform   = 'translateY(0)';
            content.style.transition = 'opacity 0.7s ease 0.2s';
            content.style.opacity    = '1';
          }); });
        }
      }

      // EXIT : vers projects
      var projLink = document.querySelector('a[href="projects.html"]');
      if (projLink) projLink.addEventListener('click', function(e) { e.preventDefault(); exitTo('projects.html'); });

      // EXIT : vers about
      var aboutLink = document.querySelector('a[href="about.html"]');
      if (aboutLink) aboutLink.addEventListener('click', function(e) { e.preventDefault(); exitTo('about.html'); });
    })();
  </script>
