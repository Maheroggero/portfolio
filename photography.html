<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series 01 — Mahe Roggero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #FFFFFF;
      --ink:    #141412;
      --gray:   #8A8A87;
      --border: #E2E1DC;
      --f:      'DM Sans', system-ui, sans-serif;
      --top-gap: clamp(130px, 22vh, 180px);
    }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    nav {
      display: grid;
      grid-template-columns: clamp(180px, 29vw, 420px) 1fr;
      align-items: center;
      padding: 18px clamp(24px, 4vw, 56px);
      position: sticky;
      top: 0;
      background: transparent;
      z-index: 10;
    }

    .logo { font-size: 13px; font-weight: 500; letter-spacing: 0.01em; transition: opacity 0.2s; }
    .logo:hover { opacity: 0.4; }

    .nav-links { display: flex; gap: 28px; justify-self: start; }
    .nav-links a { font-size: 13px; font-weight: 400; color: var(--gray); transition: color 0.2s; }
    .nav-links a:hover { color: var(--ink); }

    .spacer { height: var(--top-gap); }

    .body-layout {
      display: grid;
      grid-template-columns: clamp(180px, 29vw, 420px) 1fr;
      padding: 0 32px clamp(80px, 12vw, 140px) clamp(24px, 4vw, 56px);
      gap: 0;
      align-items: start;
    }

    .sidebar {
      position: fixed;
      top: calc(var(--top-gap) + 18px + 13px + 18px);
      left: clamp(24px, 4vw, 56px);
      width: calc(clamp(180px, 29vw, 420px) - clamp(24px, 4vw, 56px) - 20px);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .project-title { font-size: 13px; font-weight: 500; color: var(--ink); letter-spacing: 0.01em; }
    .project-year { font-size: 12px; font-weight: 300; color: var(--gray); letter-spacing: 0.01em; margin-top: -12px; }

    .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      color: var(--ink);
      background-color: #EDECE8;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.5;
    }

    .project-desc { font-size: 12px; color: var(--gray); font-weight: 300; line-height: 1.7; margin-top: 4px; }

    .back { font-size: 12px; color: var(--gray); transition: color 0.2s; letter-spacing: 0.02em; }
    .back:hover { color: var(--ink); }

    .project-images { grid-column: 2; display: flex; flex-direction: column; gap: clamp(8px, 1vw, 14px); }

    .img-row { display: flex; gap: clamp(8px, 1vw, 14px); }

    .img-wrap { overflow: hidden; background: var(--border); flex: 1; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-wrap picture { display: contents; }

    .img-row.hero .img-wrap    { aspect-ratio: 16/9; }
    .img-row.two-col .img-wrap { aspect-ratio: 4/5; }
    .img-row.full-wide .img-wrap { aspect-ratio: 21/9; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .sidebar, .img-row { opacity: 0; }
    .sidebar.visible { animation: fadeUp 0.65s cubic-bezier(0.25, 0, 0.1, 1) both; }
    .img-row.visible  { animation: fadeUp 0.65s cubic-bezier(0.25, 0, 0.1, 1) both; }

    @media (max-width: 900px) {
      nav { grid-template-columns: 1fr auto; }
      .body-layout { grid-template-columns: 1fr; }
      .sidebar { position: static; width: auto; padding-bottom: 28px; }
      .project-images { grid-column: 1; }
    }
    @media (max-width: 640px) {
      .img-row.two-col { flex-direction: column; }
      .spacer { height: 10vh; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Mahe Roggero</a>
    <div class="nav-links">
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <div class="spacer"></div>

  <div class="body-layout">

    <aside class="sidebar">
      <a href="projects.html" class="back">← All Projects</a>
      <span class="project-title">Series 01</span>
      <span class="project-year">2025</span>
      <div class="meta-tags">
        <span class="tag">Photography</span>
      </div>
      <p class="project-desc">An ongoing personal series exploring everyday gestures and the overlooked geometry of domestic space. Shot on film over the course of a year.</p>
    </aside>

    <div class="project-images">
      <div class="img-row hero">
        <div class="img-wrap"><picture>
  <source srcset="images/photography.webp" type="image/webp">
  <img src="images/photography.jpg" alt="Series 01">
</picture></div>
      </div>
      <div class="img-row two-col">
        <div class="img-wrap"><img src="https://placehold.co/600x800/E8E7E3/8A8A87" alt="" loading="lazy"></div>
        <div class="img-wrap"><img src="https://placehold.co/600x800/D8D7D3/8A8A87" alt="" loading="lazy"></div>
      </div>
      <div class="img-row full-wide">
        <div class="img-wrap"><img src="https://placehold.co/1600x900/DDDCD8/8A8A87" alt="" loading="lazy"></div>
      </div>
      <div class="img-row two-col">
        <div class="img-wrap"><img src="https://placehold.co/600x800/E2E1DC/8A8A87" alt="" loading="lazy"></div>
        <div class="img-wrap"><img src="https://placehold.co/600x800/C8C7C3/8A8A87" alt="" loading="lazy"></div>
      </div>
      <div class="img-row full-wide">
        <div class="img-wrap"><img src="https://placehold.co/1600x900/D0CFCB/8A8A87" alt="" loading="lazy"></div>
      </div>
      <div class="img-row two-col">
        <div class="img-wrap"><img src="https://placehold.co/600x800/DDDCD8/8A8A87" alt="" loading="lazy"></div>
        <div class="img-wrap"><img src="https://placehold.co/600x800/E8E7E3/8A8A87" alt="" loading="lazy"></div>
      </div>
      <div class="img-row full-wide">
        <div class="img-wrap"><img src="https://placehold.co/1600x900/C8C7C3/8A8A87" alt="" loading="lazy"></div>
      </div>
    </div>
  </div>

  <script>
    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting);
      visible.forEach((entry, i) => {
        const el = entry.target;
        el.style.animationDelay = (i * 0.06) + 's';
        el.classList.add('visible');
        observer.unobserve(el);
      });
    }, { threshold: 0.05, rootMargin: '0px 0px 200px 0px' });
    document.querySelectorAll('.sidebar, .img-row').forEach(el => observer.observe(el));
  </script>

</body>
</html>
